name: Deploy to GitHub Pages


on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Check secrets
        env:
          GAS_URL: ${{ secrets.REACT_APP_GAS_URL }}
          WRITE_TOKEN: ${{ secrets.REACT_APP_WRITE_TOKEN }}
        run: |
          if ! printf '%s' "$GAS_URL" | grep -Eq '^https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec$'; then
            echo "::error::REACT_APP_GAS_URL 格式不對：必須是 https://script.google.com/macros/s/…/exec（前後不能有空白，不要加 ?action=）"
            exit 1
          fi
          if [ -z "$WRITE_TOKEN" ]; then
            echo "::error::REACT_APP_WRITE_TOKEN 沒有設定"
            exit 1
          fi
          echo "Secrets 格式正確"
      - run: npm ci --legacy-peer-deps
      - name: Lint
        run: npx eslint src/ --max-warnings 0
      - name: Run tests
        run: npx react-scripts test --watchAll=false
      - name: Build
        run: npm run build
        env:
          REACT_APP_GAS_URL: ${{ secrets.REACT_APP_GAS_URL }}
          REACT_APP_WRITE_TOKEN: ${{ secrets.REACT_APP_WRITE_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - id: deployment
        uses: actions/deploy-pages@v4
